<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Board</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="container">
        <div class="tool-bar" id="toolBar">
            <button class="toolItem" id="pencilButton">Pencil</button>
            <button class="toolItem" id="erasorButton">Erasor</button>
            <button class="toolItem" id="undoButton">Undo</button>
            <button class="toolItem" id="redoButton">Redo</button>
            <button class="toolItem" id="clearButton">Clear</button>
            <input type="color" id="colorPicker" class="toolItem">
            Width: <input type="range" id="sizePicker" class="toolItem" min="1" max="50" value="5">

        </div>
        <canvas
            id="drawing-area">
        </canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
